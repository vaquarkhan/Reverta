services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: atp
      POSTGRES_PASSWORD: atp
      POSTGRES_DB: atp
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atp"]
      interval: 2s
      timeout: 3s
      retries: 20
  engine:
    build:
      context: ..
    ports:
      - "8080:8080"
    environment:
      ATP_JDBC_URL: jdbc:postgresql://postgres:5432/atp
      ATP_JDBC_USER: atp
      ATP_JDBC_PASSWORD: atp
    depends_on:
      postgres:
        condition: service_healthy
