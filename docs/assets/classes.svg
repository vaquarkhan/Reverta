<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300">
  <rect width="900" height="300" fill="#fffaf2"/>
  <g font-family="Georgia, 'Times New Roman', serif">
    <rect x="24" y="24" width="270" height="252" rx="16" fill="#f4efe4" stroke="#ddd4c4"/>
    <text x="48" y="64" fill="#1d3b32" font-size="15">ATOMIC_BRANCHABLE</text>
    <path d="M70 150 V230" fill="none" stroke="#1d3b32" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M70 176 c 40 0, 50 18, 110 18" fill="none" stroke="#8a6a32" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="70" cy="150" r="5" fill="#1d3b32"/>
    <circle cx="180" cy="194" r="5" fill="#8a6a32"/>
    <circle cx="70" cy="230" r="5" fill="#1d3b32"/>
    <text x="48" y="120" fill="#1c1914" font-size="20">Private branch</text>
    <text x="48" y="250" fill="#5c564c" font-size="15">Publish, or discard.</text>

    <rect x="314" y="24" width="270" height="252" rx="16" fill="#f4efe4" stroke="#ddd4c4"/>
    <text x="338" y="64" fill="#1d3b32" font-size="15">COMPENSATABLE</text>
    <text x="338" y="120" fill="#1c1914" font-size="20">A declared inverse</text>
    <rect x="348" y="148" width="90" height="40" rx="8" fill="#fffaf2" stroke="#1d3b32"/>
    <text x="393" y="174" text-anchor="middle" fill="#1c1914" font-size="14">forward</text>
    <path d="M448 168 H490" fill="none" stroke="#8a6a32" stroke-width="2" stroke-linecap="round"/>
    <polygon points="490,168 478,162 478,174" fill="#8a6a32"/>
    <rect x="496" y="148" width="64" height="40" rx="8" fill="#fffaf2" stroke="#8d3b2f"/>
    <text x="528" y="174" text-anchor="middle" fill="#1c1914" font-size="14">void</text>
    <text x="338" y="230" fill="#5c564c" font-size="15">Mapping is an expression.</text>
    <text x="338" y="252" fill="#5c564c" font-size="15">The model does not write it.</text>

    <rect x="604" y="24" width="272" height="252" rx="16" fill="#fff6f3" stroke="#e4c7c0"/>
    <text x="628" y="64" fill="#8d3b2f" font-size="15">IRREVERSIBLE</text>
    <text x="628" y="120" fill="#1c1914" font-size="20">No honest inverse</text>
    <circle cx="740" cy="176" r="28" fill="none" stroke="#8d3b2f" stroke-width="2.5"/>
    <path d="M740 162 v16" fill="none" stroke="#8d3b2f" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="740" cy="188" r="2" fill="#8d3b2f"/>
    <text x="628" y="240" fill="#5c564c" font-size="15">A person decides first.</text>
    <text x="628" y="262" fill="#5c564c" font-size="15">Later failure stays orphaned.</text>
  </g>
</svg>
